<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Black Holes</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="background">

        <video autoplay muted loop playsinline class="background-video">
            <source src="videos/background.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="main-container load-animation">
            <div class="title">
                <p>Binary Black Holes</p>
            </div>

            <div class = "row">
                <div class="left-container subtitle">
                    <p>Roadmap</p>
                </div>

                <div class="right-container">
                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="1. Initial setup and configuration of the project. This includes setting up github, creating the files, and initial planning.">
                        <p>1</p>
                    </div>

                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="2. Writing the physics equations into Python. Some of these equations calculate things like black hole position overtime, 
                    distance between black holes overtime, strain amplitude changes overtime, and waveform overtime.">
                        <p>2</p>
                    </div>

                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="3. Displaying test results onto the console.">
                        <p>3</p>
                    </div>

                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="4. Modelling test results in 2D using excel spreadsheets.">
                        <p>4</p>
                    </div>

                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="5. Creating a 3D rendering engine using linear algebra.">
                        <p>5</p>
                    </div>

                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="6. Modelling a black hole and using the 3D rendering engine to show its behavior overtime.">
                        <p>6</p>
                    </div>

                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="7. Creating a side panel to show black hole data that was previously displayed in the console.">
                        <p>7 </p>
                    </div>

                    <div class="hover-container" data-hover-group="roadmap" 
                    data-hover-info="8. Creating a website to show results.">
                        <p>8 </p>
                    </div>
                </div>
            </div>
        </div>

        <script src="javascript.js"></script>

    </body>
</html>
